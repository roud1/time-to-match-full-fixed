name: Scheduled jobs

# Vercel Hobby only allows daily cron jobs, so frequent jobs run from GitHub Actions.
# Required repository secrets: APP_URL (e.g. https://your-app.vercel.app, no trailing slash)
# and CRON_SECRET (must equal the CRON_SECRET env var set in Vercel).
# GitHub runs schedules at most every 5 minutes and may delay them under load.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL / CRON_SECRET secrets are not set yet - skipping."
            exit 0
          fi
          call() {
            curl -sS --fail --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/v1/cron/$1" >/dev/null \
              && echo "ok: $1" || { echo "::warning::failed: $1"; return 1; }
          }
          rc=0
          call expire-matches || rc=1
          call ai-analysis || rc=1
          # notify previously ran every 15 minutes
          if [ "$(( 10#$(date -u +%M) % 15 ))" -lt 5 ]; then call notify || rc=1; fi
          exit $rc
