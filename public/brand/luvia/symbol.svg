<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 10 676 500" fill="none">
  <title>Luvia</title>
  <defs>
    <linearGradient id="lv-l" x1="70" y1="60" x2="360" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2C2FF"/>
      <stop offset="0.38" stop-color="#D08CFF"/>
      <stop offset="1" stop-color="#8E3BEA"/>
    </linearGradient>
    <linearGradient id="lv-r" x1="660" y1="40" x2="300" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6D4FF"/>
      <stop offset="0.35" stop-color="#D597FF"/>
      <stop offset="0.75" stop-color="#B66CFF"/>
      <stop offset="1" stop-color="#9A3CFF"/>
    </linearGradient>
    <radialGradient id="lv-shade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 250) rotate(-30) scale(190 120)">
      <stop offset="0.35" stop-color="#4B1590" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4B1590" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lv-ring" x1="270" y1="300" x2="620" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3B3FF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#B66CFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E08CFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- translucent strands that close the lower right of the heart into its point -->
  <path d="M582 336C548 410 456 470 372 490" stroke="url(#lv-ring)" stroke-width="6" stroke-linecap="round"/>
  <path d="M600 300C574 400 470 470 366 486" stroke="url(#lv-ring)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <!-- left ribbon -->
  <path fill="url(#lv-l)" d="M372 488C250 400 60 300 52 170C46 80 120 28 200 30C290 32 360 70 404 112C340 82 262 72 204 100C152 126 140 200 170 280C210 380 310 450 372 488Z"/>
  <!-- right ribbon: wide lobe ending in a tail that crosses into the point -->
  <path fill="url(#lv-r)" d="M318 478C262 400 262 290 330 200C400 100 480 34 570 28C650 24 690 90 682 160C674 240 630 300 582 336C590 280 574 222 520 202C460 182 400 220 360 280C322 340 302 410 318 478Z"/>
  <path fill="url(#lv-shade)" d="M318 478C262 400 262 290 330 200C400 100 480 34 570 28C650 24 690 90 682 160C674 240 630 300 582 336C590 280 574 222 520 202C460 182 400 220 360 280C322 340 302 410 318 478Z"/>
</svg>
