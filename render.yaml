# Render Blueprint — https://render.com/docs/blueprint-spec
# Free plan for testing. For real users switch `plan: free` -> `plan: starter` (no sleep).
# Free instances sleep after ~15 min idle; the GitHub Actions "Scheduled jobs" workflow pings every 5 min.

services:
  - type: web
    name: time-to-match-web
    runtime: node
    region: frankfurt
    plan: free
    # --include=dev: NODE_ENV=production would otherwise skip devDependencies (tailwind/typescript are needed to build).
    # Migrations run during build (pre-deploy commands are not available on the free plan).
    buildCommand: >-
      npm install --legacy-peer-deps --include=dev &&
      npm run build &&
      cp -r public .next/standalone/public &&
      cp -r .next/static .next/standalone/.next/static &&
      npm run db:migrate
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_POOL_MAX
        value: "2"
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Enter in the Render dashboard when prompted:
      - key: DATABASE_URL        # Neon connection string, ending with ?sslmode=require
        sync: false
      - key: NEXT_PUBLIC_APP_URL # https://time-to-match-web.onrender.com (must match the real URL; set before build)
        sync: false
